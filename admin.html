<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Peace Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body id="body">
  <div class="container-fluid">
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="./admin.html">PEACE LIBRARY</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="./admin.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./admin.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto">
            <li class="nav-item" id="light">
              L
            </li>
            <li class="nav-item" id="dark">
              D
            </li>
            <li class="nav-item d-flex align-items-center">
              <img id="info" src="./image.png" alt="User" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;">
              <span id="userInfo">Admin</span>
            </li>
            <li class="nav-item">
              <button class="btn btn-outline-primary" id="logoutBtn">Logout</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="container">
      <h2>Registered Users</h2>
      <div id="userList" class="row"></div>
    </section>

    <section class="container">
      <h2>Books Collection</h2>
      <div class="card p-3 shadow-sm mb-4">
        <h3>Add New Book</h3>
        <form id="addBookForm">
          <div class="form-group">
            <label for="bookTitle">Title</label>
            <input type="text" id="bookTitle" name="title" required>
            <span class="error-message" id="titleError"></span>
          </div>
          <div class="form-group">
            <label for="bookAuthor">Author</label>
            <input type="text" id="bookAuthor" name="author" required>
            <span class="error-message" id="authorError"></span>
          </div>
          <div class="form-group">
            <label for="bookGenre">Genre</label>
            <select id="bookGenre" name="genre" required>
              <option value="">Select Genre</option>
              <option value="Thriller">Thriller</option>
              <option value="Action">Action</option>
              <option value="Comedy">Comedy</option>
              <option value="Fiction">Fiction</option>
              <option value="Non-fiction">Non-fiction</option>
              <option value="Horror">Horror</option>
              <option value="Drama">Drama</option>
              <option value="Novel">Novel</option>
              <option value="Narrative">Narrative</option>
              <option value="Mystery">Mystery</option>
            </select>
            <span class="error-message" id="genreError"></span>
          </div>
          <div class="form-group">
            <label for="bookImage">Cover Image URL (Optional)</label>
            <input type="url" id="bookImage" name="image" placeholder="https://example.com/image.jpg">
            <span class="error-message" id="imageError"></span>
          </div>
          <button type="submit" class="btn btn-outline-primary">Add Book</button>
        </form>
      </div>
      <div id="bookList" class="row"></div>
    </section>

    <footer id="footer" class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
      <div class="col-md-4 d-flex align-items-center">
        <span class="mb-3 mb-md-0 text-body-secondary">©  <span id="date"> </span>Peace Library, Inc</span>
      </div>
      <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <li class="ms-3"><a class="text-body-secondary" href="#">Instagram</a></li>
        <li class="ms-3"><a class="text-body-secondary" href="#">Facebook</a></li>
      </ul>
    </footer>
  </div>

  <script src="./admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
