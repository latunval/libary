<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peace Library - Login</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body id="body">
  <nav class="navbar navbar-expand-lg navbar-light fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="./login.html">PEACE LIBRARY</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="./login.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="books">Books</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>
        <li class="nav-item" id="light">
          L
        </li>
        <li class="nav-item" id="dark">
          D
        </li>
      </div>
    </div>
  </nav>
  <section class="logSection">
    <div class="container2" id="container2">
      <div class="form-container2" id="logs">
        <div class="form-wrapper" id="login-section">
          <h2>Login</h2>
          <div class="error-container" id="loginErrorContainer"></div>
          <form id="loginForm" autocomplete="on">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email">
              <span class="error-message" id="emailError"></span>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password">
              <span class="error-message" id="passwordError"></span>
            </div>
            <button type="submit" id="log">Login</button>
            <p class="form-footer">
              Don't have an account? <a href="#" id="showSignup" class="logs">Sign up</a>
            </p>
          </form>
        </div>
        <div class="form-wrapper" id="signup-section" style="display: none;">
          <h2>Sign Up</h2>
          <div class="error-container" id="signupErrorContainer"></div>
          <form id="signupForm" autocomplete="on">
            <div class="input-row">
              <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName">
                <span class="error-message" id="nameError"></span>
              </div>
              <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" name="email">
                <span class="error-message" id="emailError"></span>
              </div>
            </div>
            <div class="input-row">
              <div class="form-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" name="password">
                <span class="error-message" id="passwordError"></span>
              </div>
              <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <span class="error-message" id="confirmPasswordError"></span>
              </div>
            </div>
            <button type="submit" id="sign">Sign Up</button>
            <p class="form-footer">
              Already have an account? <a href="#" id="showLogin" class="logs">Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </section>
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
    <div class="col-md-4 d-flex align-items-center">
      <span class="mb-3 mb-md-0 text-body-secondary">© <span id="date"> </span>Peace Library, Inc</span>
    </div>
    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
      <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Instagram">Instagram</a></li>
      <li class="ms-3"><a class="text-body-secondary" href="#" aria-label="Facebook">Facebook</a></li>
    </ul>
  </footer>
  <script src="./log.js"></script>
</body>
</html>
